name: Windows

on: 
  workflow_dispatch:
permissions:
  contents: write  # Required for GITHUB_TOKEN to push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: true
      - name: Setup NGROK
        run: |
             wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
             sudo tar -xvzf ngrok-v3-stable-linux-amd64.tgz -C /usr/local/bin
             cd /home/runner/work/windows-qemu/windows-qemu
             mkdir -p ~/.config/ngrok
             cp ngrok.yml ~/.config/ngrok/ngrok.yml
             ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}
             cat ~/.config/ngrok/ngrok.yml
             
      - name: Start Windows
        run: |
             cd /home/runner/work/windows-qemu/windows-qemu
             docker compose up -d
             ngrok start --all --log=stdout
             
      - name: Sync files
        if: always()
        run: |
          git config --global user.name "${{ secrets.GITHUB_USER }}"
          git config --global user.email "${{ secrets.GITHUB_MAIL }}"
          git add .
          git commit -m "Sync changes" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}
