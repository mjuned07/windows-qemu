name: Windows

on: 
  workflow_dispatch:
permissions:
  contents: write  # Required for GITHUB_TOKEN to push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
         tool-cache: false
        
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
         android: true
         dotnet: true
         haskell: true
         large-packages: true
         docker-images: true
         swap-storage: true
          
      - name: Setup NGROK
        run: |
             wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
             wget https://github.com/fastfetch-cli/fastfetch/releases/download/2.49.0/fastfetch-linux-amd64.tar.gz
             sudo tar -xvzf ngrok-v3-stable-linux-amd64.tgz -C /usr/local/bin
             sudo tar -xvzf fastfetch-linux-amd64.tar.gz -C /usr/local/bin fastfetch-linux-amd64/usr/bin/fastfetch --strip-components=3
             rm ngrok-v3-stable-linux-amd64.tgz fastfetch-linux-amd64.tar.gz
             cd /home/runner/work/windows-qemu/windows-qemu
             mkdir -p ~/.config/ngrok
             wget https://raw.githubusercontent.com/mjuned07/windows-qemu/refs/heads/master/ngrok.yml
             cp ngrok.yml ~/.config/ngrok/ngrok.yml
             ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}
             cat ~/.config/ngrok/ngrok.yml
             
      - name: Start Windows
        run: |
             ulimit -s unlimited
             mkdir -p windows storage
             sudo fastfetch -l none
             aria2c -s16 -x16 "https://archive.org/download/windows-docker/data.qcow2" --out windows/data.qcow2
             aria2c -s16 -x16 "https://archive.org/download/projects-2.1.7z/Projects-2.1.7z"
             aria2c -s16 -x16 "https://archive.org/download/E3D_2.1.0-cr/Everything-3D-2.1.0_Crack.zip" --out e3d.zip
             aria2c -s16 -x16 "https://download.mozilla.org/?product=firefox-esr115-msi-latest-ssl&os=win64&lang=en-US" --out storage/firefox-esr115.msi
             unzip -d storage e3d.zip
             7z x -o./storage Projects-2.1.7z
             rm Projects-2.1.7z
             rm e3d.zip
             sudo echo "windows/data.qcow2" > windows/windows.boot
             docker run -d --rm --name windows \
             -p 8006:8006 \
             -p 3389:3389/tcp \
             -p 3389:3389/udp \
             --device=/dev/kvm \
             --device=/dev/net/tun \
             --cap-add NET_ADMIN \
             -v "${PWD:-.}/windows:/storage" \
             -v /home/runner/work/windows-qemu/windows-qemu:/shared \
             --stop-timeout 120 \
             -e RAM_SIZE=8G \
             -e CPU_CORES=2 \
             docker.io/dockurr/windows
             ngrok start --all --log=stdout
